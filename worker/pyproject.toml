[project]
name = "ramune-shell-worker"
version = "0.1.0"
description = "Remote worker daemon for Ramune-shell"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ramune-shell-protocol",
]

[tool.uv.sources]
ramune-shell-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramune_shell_worker"]
