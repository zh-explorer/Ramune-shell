[project]
name = "ramune-shell"
version = "0.1.0"
description = "Remote machine control for AI agents via MCP"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "msgpack>=1.0",
    "pydantic>=2.0",
    "mcp>=1.8.0",
    "asyncssh>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ramune_shell"]

[tool.pytest.ini_options]
markers = ["integration: requires external infrastructure (docker/ssh)"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.26",
]
