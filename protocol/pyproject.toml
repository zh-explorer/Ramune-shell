[project]
name = "ramune-shell-protocol"
version = "0.1.0"
description = "Shared protocol for Ramune-shell server and client"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "msgpack>=1.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramune_shell_protocol"]
