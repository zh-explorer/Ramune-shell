[project]
name = "ramune-shell-mcp"
version = "0.1.0"
description = "MCP server for Ramune-shell remote machine control"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.8.0",
    "paramiko>=3.0",
    "ramune-shell-protocol",
]

[tool.uv.sources]
ramune-shell-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramune_shell_mcp"]
